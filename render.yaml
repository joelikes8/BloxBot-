
services:
  - type: web
    name: bloxbot-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: bloxbot-db
          property: connectionString

  - type: worker
    name: bloxbot-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: bloxbot-db
          property: connectionString
      - key: DISCORD_TOKEN
        sync: false

databases:
  - name: bloxbot-db
    databaseName: bloxbot
    user: bloxbot
